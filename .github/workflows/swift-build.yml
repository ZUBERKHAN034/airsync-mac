name: Build, Package & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Create required xcconfig files
        run: |
          cat > airsync-mac/Configs/Shared.xcconfig << 'XCEOF'
          SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited)
          XCEOF
          cat > airsync-mac/Configs/Secrets.xcconfig << 'XCEOF'
          TRIAL_SECRET = CI_BUILD_PLACEHOLDER
          XCEOF

      - name: Build Release
        run: |
          xcodebuild -scheme airsync-mac \
            -configuration Release \
            -sdk macosx \
            -destination "platform=macOS" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO \
            SUPPORTED_PLATFORMS=macosx \
            SUPPORTS_MACCATALYST=NO \
            build 2>&1 | tail -5
          echo "=== Build complete, listing DerivedData ==="
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 1 -type d -name "airsync*" 2>/dev/null
          DERIVED=$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 1 -type d -name "airsync*" | head -1)
          echo "DerivedData project dir: $DERIVED"
          find "$DERIVED" -name "*.app" -type d 2>/dev/null

      - name: Package DMG
        run: |
          DERIVED=$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 1 -type d -name "airsync*" | head -1)
          APP=$(find "$DERIVED" -name "AirSync.app" -type d | head -1)
          echo "APP=$APP"
          test -d "$APP" || { echo "FAIL"; exit 1; }
          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "AirSync" -srcfolder dmg-staging -ov -format UDZO -fs HFS+ AirSync.dmg
          ls -lh AirSync.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync.dmg
          path: AirSync.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AirSync.dmg
          generate_release_notes: true
