name: Build, Package & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Create required xcconfig files
        run: |
          cat > airsync-mac/Configs/Shared.xcconfig << 'XCEOF'
          SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited)
          XCEOF
          cat > airsync-mac/Configs/Secrets.xcconfig << 'XCEOF'
          TRIAL_SECRET = CI_BUILD_PLACEHOLDER
          XCEOF

      - name: Build Release
        run: |
          xcodebuild -scheme airsync-mac -configuration Release \
            -sdk macosx -destination "platform=macOS" \
            CONFIGURATION_BUILD_DIR="$PWD/output" \
            DEVELOPMENT_TEAM="" CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -5

          echo "=== Contents of output dir ==="
          find "$PWD/output" -maxdepth 2 -name "*.app" -type d 2>/dev/null || echo "(no .app found)"
          ls -la "$PWD/output/" 2>/dev/null || echo "(output dir missing)"

      - name: Package DMG
        run: |
          APP="$(find "$PWD/output" -name "AirSync.app" -type d 2>/dev/null | head -1)"
          test -n "$APP" || APP="$PWD/output/Release/AirSync.app"
          test -n "$APP" || APP="$PWD/output/AirSync.app"
          echo "APP=$APP"
          test -d "$APP" || { echo "FAIL: .app not found"; exit 1; }
          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "AirSync" -srcfolder dmg-staging -ov -format UDZO -fs HFS+ AirSync.dmg
          ls -lh AirSync.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync.dmg
          path: AirSync.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AirSync.dmg
          generate_release_notes: true
