name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Create required xcconfig files
        run: |
          cat > airsync-mac/Configs/Shared.xcconfig << 'XCEOF'
          SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited)
          XCEOF
          cat > airsync-mac/Configs/Secrets.xcconfig << 'XCEOF'
          TRIAL_SECRET = CI_BUILD_PLACEHOLDER
          XCEOF

      - name: Build
        run: |
          xcodebuild build \
            -scheme AirSync \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO

      - name: Package
        run: |
          APP="DerivedData/Build/Products/Release/AirSync.app"
          test -d "$APP" || { echo "FAIL: .app not found"; exit 1 }

          codesign --force --deep --sign - "$APP" 2>/dev/null || echo "Signing skipped (non-fatal)"

          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "AirSync" -srcfolder dmg-staging -ov -format UDZO -fs HFS+ AirSync.dmg
          ls -lh AirSync.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync
          path: AirSync.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AirSync.dmg
          generate_release_notes: true
