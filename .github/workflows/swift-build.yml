name: Build, Package & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Create required xcconfig files
        run: |
          cat > airsync-mac/Configs/Shared.xcconfig << 'XCEOF'
          SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited)
          XCEOF
          cat > airsync-mac/Configs/Secrets.xcconfig << 'XCEOF'
          TRIAL_SECRET = CI_BUILD_PLACEHOLDER
          XCEOF

      - name: Build and Package DMG
        run: |
          set -euo pipefail

          echo "=== Building ==="
          xcodebuild -scheme airsync-mac \
            -configuration Release \
            -sdk macosx \
            -destination "platform=macOS" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SUPPORTED_PLATFORMS=macosx \
            SUPPORTS_MACCATALYST=NO \
            build 2>&1 | tail -5

          echo "=== Finding .app ==="
          BUILT_DIR=$(xcodebuild -scheme airsync-mac -configuration Release -showBuildSettings 2>/dev/null | grep " BUILT_PRODUCTS_DIR " | head -1 | awk '{print $3}')
          echo "BUILT_PRODUCTS_DIR=$BUILT_DIR"

          APP_PATH="$BUILT_DIR/AirSync.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData -maxdepth 5 -name "AirSync.app" -type d 2>/dev/null | head -1)
          fi
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find /var/folders -name "AirSync.app" -maxdepth 10 -type d 2>/dev/null | head -1)
          fi
          echo "Final APP_PATH=$APP_PATH"
          if [ ! -d "$APP_PATH" ]; then
            echo "Searching everywhere..."
            find /Users/runner/Library/Developer -name "AirSync.app" -maxdepth 10 -type d 2>/dev/null | head -5
            echo "ERROR: Cannot find AirSync.app"
            exit 1
          fi

          echo "=== Creating DMG ==="
          mkdir -p dmg-staging
          cp -R "$APP_PATH" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "AirSync" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            -fs HFS+ \
            AirSync.dmg

          echo "=== DMG created ==="
          ls -lh AirSync.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync.dmg
          path: AirSync.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AirSync.dmg
          generate_release_notes: true
