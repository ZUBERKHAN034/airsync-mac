name: Build, Package & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Create required xcconfig files
        run: |
          cat > airsync-mac/Configs/Shared.xcconfig << 'XCEOF'
          SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited)
          XCEOF
          cat > airsync-mac/Configs/Secrets.xcconfig << 'XCEOF'
          TRIAL_SECRET = CI_BUILD_PLACEHOLDER
          XCEOF

      - name: Build Release
        run: |
          xcodebuild -scheme airsync-mac \
            -configuration Release \
            -sdk macosx \
            -destination "platform=macOS" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SUPPORTED_PLATFORMS=macosx \
            SUPPORTS_MACCATALYST=NO \
            build 2>&1 | tail -5

      - name: Get config build dir
        id: cfg
        run: |
          CFG_DIR=$(xcodebuild -scheme airsync-mac -configuration Release -showBuildSettings 2>/dev/null | grep " CONFIGURATION_BUILD_DIR" | head -1 | awk '{print $3}')
          echo "CONFIGURATION_BUILD_DIR=$CFG_DIR"
          ls "$CFG_DIR" || echo "Can't list cfg dir"
          echo "cfg_dir=$CFG_DIR" >> $GITHUB_OUTPUT

      - name: Prepare app bundle
        run: |
          CFG_DIR="${{ steps.cfg.outputs.cfg_dir }}"
          find "$CFG_DIR" -maxdepth 1 -name "*.app" -type d || true
          APP_PATH="$CFG_DIR/AirSync.app"
          if [ -d "$APP_PATH" ]; then
            echo "Found at: $APP_PATH"
            cp -R "$APP_PATH" AirSync.app
          else
            echo "Not at expected path, searching..."
            APP_PATH="$(find /Users/runner/Library/Developer/Xcode/DerivedData -maxdepth 3 -name "AirSync.app" -type d 2>/dev/null | head -1)"
            if [ -z "$APP_PATH" ]; then
              echo "ERROR: Could not find AirSync.app"
              find /Users/runner/Library/Developer/Xcode/DerivedData -name "AirSync.app" -type d 2>/dev/null || true
              exit 1
            fi
            echo "Found via search: $APP_PATH"
            cp -R "$APP_PATH" AirSync.app
          fi

      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -R AirSync.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "AirSync" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            -fs HFS+ \
            AirSync.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync.dmg
          path: AirSync.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AirSync.dmg
          generate_release_notes: true
