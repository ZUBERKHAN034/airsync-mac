name: Build, Package & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Create required xcconfig files
        run: |
          cat > airsync-mac/Configs/Shared.xcconfig << 'XCEOF'
          SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited)
          XCEOF
          cat > airsync-mac/Configs/Secrets.xcconfig << 'XCEOF'
          TRIAL_SECRET = CI_BUILD_PLACEHOLDER
          XCEOF

      - name: Build Debug (validates scheme)
        run: |
          xcodebuild -scheme airsync-mac -configuration Debug \
            -sdk macosx -destination "platform=macOS" \
            DEVELOPMENT_TEAM="" CODE_SIGNING_ALLOWED=NO clean build 2>&1 | tail -3

      - name: Build Release
        run: |
          xcodebuild -scheme airsync-mac -configuration Release \
            -sdk macosx -destination "platform=macOS" \
            DEVELOPMENT_TEAM="" CODE_SIGNING_ALLOWED=NO clean build 2>&1 | tail -3

      - name: Package DMG
        run: |
          # Try BUILT_PRODUCTS_DIR first
          BPD=$(xcodebuild -scheme airsync-mac -configuration Release -showBuildSettings 2>/dev/null | awk '/ BUILT_PRODUCTS_DIR =/{print $3}')
          APP="$BPD/AirSync.app"
          echo "BUILT_PRODUCTS_DIR=$BPD"
          if [ ! -d "$APP" ]; then
            echo "Trying BUILD_DIR..."
            BD=$(xcodebuild -scheme airsync-mac -configuration Release -showBuildSettings 2>/dev/null | awk '/ BUILD_DIR =/{print $3}')
            APP="$BD/Release/AirSync.app"
            echo "BUILD_DIR=$BD"
          fi
          if [ ! -d "$APP" ]; then
            echo "Full search..."
            find ~/Library/Developer/Xcode/DerivedData -name "AirSync.app" -type d 2>/dev/null | head -3
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "AirSync.app" -type d 2>/dev/null | head -1)
          fi
          echo "APP=$APP"
          test -d "$APP" || { echo "FAIL: cannot find AirSync.app"; exit 1; }
          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "AirSync" -srcfolder dmg-staging -ov -format UDZO -fs HFS+ AirSync.dmg
          ls -lh AirSync.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync.dmg
          path: AirSync.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AirSync.dmg
          generate_release_notes: true
