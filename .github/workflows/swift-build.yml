name: Build, Package & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build Release
        run: |
          xcodebuild -scheme airsync-mac \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Prepare app bundle
        run: |
          set -x
          echo "=== Listing DerivedData ==="
          find DerivedData/Build/Products -name "*.app" -type d 2>/dev/null || true
          echo "=== Full find ==="
          find DerivedData -name "*.app" -type d 2>/dev/null || true
          APP_PATH="$(find DerivedData -name "AirSync.app" -type d | head -1)"
          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find DerivedData -name "*.app" -type d | head -1)"
          fi
          echo "App path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find .app bundle"
            exit 1
          fi
          cp -R "$APP_PATH" AirSync.app

      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -R AirSync.app dmg-staging/
          ln -s /Applications dmg-staging/Applications

          hdiutil create -volname "AirSync" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            -fs HFS+ \
            AirSync.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync.dmg
          path: AirSync.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AirSync.dmg
          generate_release_notes: true
