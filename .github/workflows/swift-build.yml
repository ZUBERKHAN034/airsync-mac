name: Build, Package & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Create required xcconfig files
        run: |
          cat > airsync-mac/Configs/Shared.xcconfig << 'XCEOF'
          SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited)
          XCEOF
          cat > airsync-mac/Configs/Secrets.xcconfig << 'XCEOF'
          TRIAL_SECRET = CI_BUILD_PLACEHOLDER
          XCEOF

      - name: Build Release
        run: |
          mkdir -p output
          xcodebuild -scheme airsync-mac \
            -configuration Release \
            -sdk macosx \
            -destination "platform=macOS" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/output" \
            SUPPORTED_PLATFORMS=macosx \
            SUPPORTS_MACCATALYST=NO \
            build 2>&1 | tail -5
          ls -la output/

      - name: Package DMG
        run: |
          test -d "output/AirSync.app" || { echo "FAIL: AirSync.app not in output/"; ls -la output/; exit 1; }
          mkdir -p dmg-staging
          cp -R output/AirSync.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "AirSync" -srcfolder dmg-staging -ov -format UDZO -fs HFS+ AirSync.dmg
          ls -lh AirSync.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync.dmg
          path: AirSync.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AirSync.dmg
          generate_release_notes: true
